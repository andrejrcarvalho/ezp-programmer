[project]
name = "ezp-programmer"
version = "0.1.0"
description = "Qt GUI for EZP2010/EZP2012/EZP2013 USB SPI flash / EEPROM programmers"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-2.0-or-later"
dependencies = [
    "libusb-package>=1.0.30.0",
    "pyside6-essentials>=6.12.0",
    "pyusb>=1.3.1",
]

[project.scripts]
ezp-programmer = "ezp_programmer:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
]
