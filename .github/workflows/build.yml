name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release job creates a GitHub release

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Unit and GUI tests
        run: uv run pytest -v
      - name: App self-check
        run: uv run ezp-programmer --self-check

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # builds dist\EZP-Programmer-<version>-windows-x64.exe and self-checks it
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: EZP-Programmer-windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
