name: Build Windows exe

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the exe to a release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Build exe
        run: >
          uv run --with pyinstaller pyinstaller --noconfirm --clean --onefile --windowed
          --name ezp-programmer --icon packaging/icon.ico
          --collect-data ezp_programmer --collect-all libusb_package
          --paths src src/ezp_programmer/__main__.py

      - name: Check the exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ezp-programmer.exe -ArgumentList "--self-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "self-check failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: ezp-programmer-windows
          path: dist/ezp-programmer.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ezp-programmer.exe
          generate_release_notes: true
